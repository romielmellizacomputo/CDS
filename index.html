<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QA Performance Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Google+Sans+Display:wght@400;500;600;700&family=Google+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root {
  --bg: #07090f;
  --bg2: #0c0f1a;
  --surface: #111520;
  --surface2: #181d2e;
  --surface3: #1e2438;
  --border: #252b42;
  --border-bright: #323c5c;
  --text: #e4e9f7;
  --text-muted: #6b778f;
  --text-dim: #3a4260;
  --accent: #5b8fff;
  --accent2: #00e5a8;
  --warn: #ffb84d;
  --danger: #ff5577;
  --purple: #b07fff;
  --low: #5b8fff;
  --med: #b07fff;
  --high: #ffb84d;
  --urg: #ff5577;
  --font: 'Google Sans', 'Syne', sans-serif;
  --font-display: 'Google Sans Display', 'Google Sans', sans-serif;
  --mono: 'Google Sans Mono', 'DM Mono', monospace;
  --r: 10px;
  --r-lg: 16px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.6;
  min-height: 100vh;
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 0;
  opacity: 0.5;
}
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(91,143,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(91,143,255,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}

/* ── LOGIN ── */
#loginScreen {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 100; gap: 0;
  background: var(--bg);
}
.login-card {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--border-bright);
  border-radius: 20px;
  padding: 48px 48px 40px;
  width: 100%; max-width: 440px;
  text-align: center;
  box-shadow: 0 0 80px rgba(91,143,255,0.08), 0 0 0 1px rgba(91,143,255,0.1);
  animation: fadeUp 0.6s ease both;
}
.login-card::before {
  content: '';
  position: absolute;
  top: -1px; left: 50%; transform: translateX(-50%);
  width: 60%; height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  border-radius: 2px;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}
.login-logo {
  width: 64px; height: 64px;
  background: linear-gradient(135deg, var(--accent), #3a6de0);
  border-radius: 18px;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 24px;
  font-family: var(--mono); font-size: 22px; font-weight: 500;
  color: #fff;
  box-shadow: 0 8px 32px rgba(91,143,255,0.3);
}
.login-title { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 8px; font-family: var(--font-display); }
.login-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 32px; line-height: 1.5; }
.login-divider { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
.login-divider::before, .login-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.login-divider span { font-size: 11px; color: var(--text-dim); letter-spacing: 0.1em; text-transform: uppercase; }
#googleSignInBtn {
  width: 100%;
  display: flex; align-items: center; justify-content: center; gap: 12px;
  padding: 14px 20px;
  background: var(--surface2);
  border: 1px solid var(--border-bright);
  border-radius: var(--r);
  color: var(--text);
  font-family: var(--font); font-size: 14px; font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
}
#googleSignInBtn:hover { background: var(--surface3); border-color: var(--accent); box-shadow: 0 0 20px rgba(91,143,255,0.12); }
#googleSignInBtn svg { flex-shrink: 0; }
.login-note { margin-top: 20px; font-size: 11px; color: var(--text-dim); line-height: 1.6; }
#loginError {
  display: none; margin-top: 16px; padding: 10px 14px;
  background: rgba(255,85,119,0.08); border: 1px solid rgba(255,85,119,0.25);
  border-radius: var(--r); font-size: 12px; color: #ff8099; text-align: left;
}

/* ── LOADING ── */
#loadingScreen {
  position: fixed; inset: 0;
  display: none; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 99; gap: 20px; background: var(--bg);
}
.loader-ring {
  width: 48px; height: 48px;
  border: 3px solid var(--border); border-top-color: var(--accent);
  border-radius: 50%; animation: spin 0.75s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loader-text { font-family: var(--font); font-size: 13px; color: var(--text-muted); }
.loader-sub  { font-size: 11px; color: var(--text-dim); }

/* ── DASHBOARD ── */
#dashboardRoot { display: none; position: relative; z-index: 1; }
.dash { max-width: 1440px; margin: 0 auto; padding: 24px 20px; display: grid; gap: 16px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
.grid-2 > .card { height: 100%; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
.grid-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 16px; align-items: start; }
.grid-auto { display: grid; grid-template-columns: repeat(9, 1fr); gap: 12px; }
@media (max-width: 1200px) { .grid-auto { grid-template-columns: repeat(5, 1fr); } }
@media (max-width: 700px)  { .grid-auto { grid-template-columns: repeat(3, 1fr); } }

/* ── Analytics 3-col layout — equal height ── */
.analytics-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 16px;
  align-items: stretch;
}
.analytics-col-left {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.analytics-col-left .card {
  flex: 1;
  min-height: 0;
}
.analytics-grid > .card {
  height: 100%;
}

/* ── Cards ── */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-lg); padding: 22px;
  position: relative; transition: border-color 0.2s;
}
.card:hover { border-color: var(--border-bright); }
.card-title {
  font-size: 10px; font-weight: 600;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--text-dim); margin-bottom: 18px;
  font-family: var(--font);
}

/* ── Header ── */
.topbar {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-lg); padding: 18px 24px;
  display: flex; align-items: center; justify-content: space-between;
  gap: 20px; flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 14px; }
.brand-logo {
  width: 44px; height: 44px;
  background: linear-gradient(135deg, var(--accent), #3a6de0);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 15px; font-weight: 500; color: #fff;
  box-shadow: 0 4px 16px rgba(91,143,255,0.25); flex-shrink: 0;
}
.brand-name { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; font-family: var(--font-display); }
.brand-sub  { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.sprint-meta { display: flex; align-items: center; gap: 28px; flex-wrap: wrap; }
.meta-block .label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; font-family: var(--font); }
.meta-block .val   { font-size: 13px; font-weight: 500; margin-top: 2px; font-family: var(--font); }
.progress-track { height: 5px; background: var(--surface2); border-radius: 3px; margin-top: 6px; width: 120px; overflow: hidden; }
.progress-fill  { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 3px; transition: width 1s ease; }
.topbar-actions { display: flex; gap: 8px; align-items: center; }
.user-chip {
  display: flex; align-items: center; gap: 8px; padding: 6px 12px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 999px; font-size: 12px; color: var(--text-muted);
  font-family: var(--font);
}
.user-avatar {
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--accent); display: flex;
  align-items: center; justify-content: center;
  font-size: 9px; font-weight: 600; color: #fff;
}
.btn {
  padding: 8px 16px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: var(--r); color: var(--text-muted);
  font-family: var(--font); font-size: 12px; font-weight: 500;
  cursor: pointer; transition: all 0.2s;
}
.btn:hover { border-color: var(--accent); color: var(--text); }
.btn-danger:hover { border-color: var(--danger); color: var(--danger); }

/* ── Announce ── */
.announce {
  background: rgba(91,143,255,0.06); border: 1px solid rgba(91,143,255,0.2);
  border-radius: var(--r); padding: 10px 16px;
  font-size: 12px; color: #7da4ff; font-family: var(--font);
  display: flex; align-items: center; gap: 10px;
}
.announce-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent2); box-shadow: 0 0 6px var(--accent2);
  flex-shrink: 0; animation: pulse 2s ease infinite;
}
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

/* ── KPIs ── */
.kpi {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-lg); padding: 16px 14px;
  position: relative; overflow: hidden;
}
.kpi.c-accent  { border-top: 2px solid var(--accent);  }
.kpi.c-green   { border-top: 2px solid var(--accent2); }
.kpi.c-warn    { border-top: 2px solid var(--warn);    }
.kpi.c-danger  { border-top: 2px solid var(--danger);  }
.kpi.c-purple  { border-top: 2px solid var(--purple);  }
.kpi-label { font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; font-weight: 600; font-family: var(--font); }
.kpi-value { font-family: var(--mono); font-size: 24px; font-weight: 400; line-height: 1; color: var(--text); }
.kpi-sub   { font-size: 10px; color: var(--text-dim); margin-top: 8px; font-family: var(--font); }

/* ── Section label ── */
.section-label {
  font-size: 10px; text-transform: uppercase;
  letter-spacing: 0.12em; color: var(--text-dim);
  display: flex; align-items: center; gap: 12px; margin-bottom: 4px;
  font-family: var(--font); font-weight: 600;
}
.section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* ── Tables ── */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
thead th {
  text-align: right;
  font-size: 10px; font-weight: 600;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--text-dim); padding: 8px 10px;
  border-bottom: 1px solid var(--border);
  font-family: var(--font);
}
thead th:first-child { text-align: left; }
tbody tr { border-bottom: 1px solid rgba(37,43,66,0.6); transition: background 0.12s; }
tbody tr:hover { background: rgba(255,255,255,0.02); }
tbody td { padding: 9px 10px; text-align: right; color: var(--text-muted); font-family: var(--mono); font-size: 12px; }
tbody td:first-child { text-align: left; font-family: var(--font); font-size: 13px; color: var(--text); }
tfoot td {
  padding: 10px 10px; text-align: right;
  font-weight: 500; font-family: var(--mono); font-size: 12px;
  color: var(--text); border-top: 1px solid var(--border-bright);
}
tfoot td:first-child { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; font-family: var(--font); }
.zero { color: var(--text-dim) !important; }

/* ── Priority labels ── */
.p-tag {
  display: inline-block; padding: 2px 8px;
  border-radius: 4px; font-size: 10px; font-weight: 500;
  font-family: var(--mono); letter-spacing: 0.04em;
}
.p-low  { background: rgba(91,143,255,0.12); color: #7da4ff; }
.p-med  { background: rgba(176,127,255,0.12); color: #c9a8ff; }
.p-high { background: rgba(255,184,77,0.12);  color: #ffd080; }
.p-urg  { background: rgba(255,85,119,0.12);  color: #ff8099; }

/* ── Member table avatar ── */
.avatar {
  width: 28px; height: 28px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 600; flex-shrink: 0;
  margin-right: 9px; vertical-align: middle;
  font-family: var(--font);
}
.member-cell { display: flex; align-items: center; }

/* ── Bar charts ── */
.bar-track { height: 8px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
.bar-fill  { height: 100%; border-radius: 2px; transition: width 0.8s ease; }
.rep-row { display: grid; grid-template-columns: 130px 1fr 36px; align-items: center; gap: 10px; margin-bottom: 10px; }
.rep-name { font-size: 12px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font); }

/* ── Distribution legend ── */
.dist-item { display: flex; align-items: center; gap: 10px; margin-bottom: 11px; }
.dist-dot  { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.dist-label { flex: 1; font-size: 12px; color: var(--text-muted); font-family: var(--font); }
.dist-count { font-family: var(--mono); font-size: 12px; color: var(--text); }
.dist-pct   { font-family: var(--mono); font-size: 11px; color: var(--text-dim); min-width: 44px; text-align: right; }

/* ── Priority matrix ── */
.matrix-row {
  display: grid; grid-template-columns: 110px 1fr 1fr 44px 44px;
  align-items: center; gap: 8px; padding: 5px 0;
  border-bottom: 1px solid rgba(37,43,66,0.5);
}
.matrix-row:last-child { border-bottom: none; }

/* ── Issue list ── */
.issue-item { padding: 13px 0; border-bottom: 1px solid rgba(37,43,66,0.5); }
.issue-item:last-child { border-bottom: none; }
.issue-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
.issue-title { font-size: 13px; color: var(--text); line-height: 1.4; font-family: var(--font); }
.issue-path { font-size: 11px; color: var(--text-dim); margin-top: 3px; font-family: var(--mono); }

/* ── Animations ── */
.fade-in { animation: fadeIn 0.5s ease both; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.slide-up { animation: slideUp 0.5s ease both; }
@keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

/* ── Error banner ── */
.err-banner {
  background: rgba(255,85,119,0.08); border: 1px solid rgba(255,85,119,0.25);
  border-radius: var(--r); padding: 12px 16px;
  font-size: 12px; color: #ff8099; font-family: var(--font);
}

/* ══════════════════════════════════
   MEMBERS SECTION — NEW STYLES
══════════════════════════════════ */
.members-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-lg); padding: 22px;
  position: relative; transition: border-color 0.2s;
}
.members-card:hover { border-color: var(--border-bright); }

.members-header {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; flex-wrap: wrap; margin-bottom: 16px;
}
.members-header-left {
  font-size: 10px; font-weight: 600;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--text-dim); font-family: var(--font);
  display: flex; align-items: center; gap: 10px;
}
.members-count-badge {
  font-family: var(--mono); font-size: 10px;
  padding: 2px 7px; border-radius: 4px;
  background: rgba(91,143,255,0.1); color: var(--accent);
  border: 1px solid rgba(91,143,255,0.2);
  letter-spacing: 0;
}

.members-controls {
  display: flex; align-items: center; gap: 8px;
}

/* Search input */
.members-search-wrap {
  position: relative; display: flex; align-items: center;
}
.members-search-wrap svg {
  position: absolute; left: 10px; pointer-events: none;
  color: var(--text-dim);
}
.members-search {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: var(--r); padding: 7px 12px 7px 32px;
  color: var(--text); font-family: var(--font); font-size: 12px;
  width: 200px; transition: all 0.2s; outline: none;
}
.members-search::placeholder { color: var(--text-dim); }
.members-search:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(91,143,255,0.08);
  background: var(--surface3);
  width: 240px;
}

/* Sort button */
.sort-btn {
  position: relative;
  display: flex; align-items: center; gap: 7px;
  padding: 7px 13px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: var(--r); color: var(--text-muted);
  font-family: var(--font); font-size: 12px; font-weight: 500;
  cursor: pointer; transition: all 0.2s; white-space: nowrap;
}
.sort-btn:hover { border-color: var(--accent); color: var(--text); }
.sort-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(91,143,255,0.08); }
.sort-active-dot {
  display: none; position: absolute; top: -3px; right: -3px;
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent2); box-shadow: 0 0 6px var(--accent2);
  border: 1px solid var(--bg);
}
.sort-active-dot.show { display: block; }

/* Filter dropdown */
.sort-dropdown {
  display: none; position: absolute;
  top: calc(100% + 8px); right: 0;
  width: 260px;
  background: var(--surface2); border: 1px solid var(--border-bright);
  border-radius: var(--r-lg);
  box-shadow: 0 16px 48px rgba(0,0,0,0.5), 0 0 0 1px rgba(91,143,255,0.08);
  z-index: 50; overflow: hidden;
  animation: dropIn 0.18s ease both;
}
@keyframes dropIn {
  from { opacity: 0; transform: translateY(-6px) scale(0.98); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.sort-dropdown.open { display: block; }

.sort-dropdown-header {
  padding: 14px 16px 10px;
  font-size: 10px; font-weight: 600; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--text-dim);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  font-family: var(--font);
}
.sort-clear-btn {
  font-size: 10px; color: var(--accent); cursor: pointer;
  letter-spacing: 0; text-transform: none; font-weight: 500;
  padding: 0; background: none; border: none; font-family: var(--font);
}
.sort-clear-btn:hover { color: var(--text); }

.sort-group-label {
  padding: 10px 16px 6px;
  font-size: 9px; font-weight: 600; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--text-dim);
  font-family: var(--font);
}
.sort-option {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 16px; cursor: pointer;
  transition: background 0.12s;
}
.sort-option:hover { background: rgba(255,255,255,0.03); }
.sort-option input[type=checkbox] { display: none; }
.sort-radio {
  width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0;
  border: 2px solid var(--border-bright); background: var(--surface);
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.filter-option.checked .sort-radio {
  background: var(--accent); border-color: var(--accent);
}
.sort-option.checked .sort-radio::after {
  content: '';
  width: 9px; height: 5px;
  border-left: 2px solid #fff; border-bottom: 2px solid #fff;
  transform: rotate(-45deg) translate(1px, -1px);
}
.sort-dot {
  width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
}
.sort-option-label { font-size: 12px; color: var(--text-muted); flex: 1; font-family: var(--font); }
.filter-option.checked .sort-option-label { color: var(--text); }
.sort-option-count {
  font-family: var(--mono); font-size: 10px; color: var(--text-dim);
}

.sort-divider { height: 1px; background: var(--border); margin: 4px 0; }

.sort-dropdown-footer {
  padding: 10px 16px 12px;
  border-top: 1px solid var(--border);
  display: flex; gap: 8px;
}
.sort-apply-btn {
  flex: 1; padding: 8px;
  background: var(--accent); border: none; border-radius: var(--r);
  color: #fff; font-family: var(--font); font-size: 12px; font-weight: 600;
  cursor: pointer; transition: opacity 0.2s;
}
.sort-apply-btn:hover { opacity: 0.85; }

/* Scrollable table body */
.members-table-container {
  position: relative;
  overflow: hidden;
  border-radius: 8px;
  border: 1px solid var(--border);
}
.members-table-scroll {
  max-height: 560px;
  overflow-y: auto;
  overflow-x: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--border-bright) transparent;
}
.members-table-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
.members-table-scroll::-webkit-scrollbar-track { background: transparent; }
.members-table-scroll::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 3px; }
.members-table-scroll::-webkit-scrollbar-thumb:hover { background: var(--accent); }

/* Sticky header inside scroll */
.members-table-scroll table thead th {
  position: sticky; top: 0; z-index: 2;
  background: var(--surface2);
  border-bottom: 1px solid var(--border-bright);
}

.members-tfoot-wrap {
  border-top: 1px solid var(--border-bright);
  background: var(--surface2);
  overflow-x: auto;
  scrollbar-width: none;
}
.members-tfoot-wrap::-webkit-scrollbar { display: none; }

/* No results state */
.no-results {
  padding: 32px; text-align: center;
  font-size: 13px; color: var(--text-dim);
  font-family: var(--font);
}
.no-results svg { opacity: 0.3; margin-bottom: 10px; }

/* Members footer meta */
.members-footer-meta {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 10px; font-size: 11px; color: var(--text-dim);
  font-family: var(--font);
}
.members-showing { font-family: var(--mono); }

/* ── Sprint Dropdown ── */
.sprint-dropdown-wrap {
  position: relative;
}
.sprint-select-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 12px;
  background: var(--surface2); border: 1px solid var(--border-bright);
  border-radius: var(--r); color: var(--text);
  font-family: var(--font); font-size: 13px; font-weight: 500;
  cursor: pointer; transition: all 0.2s; min-width: 200px;
  white-space: nowrap;
}
.sprint-select-btn:hover { border-color: var(--accent); box-shadow: 0 0 12px rgba(91,143,255,0.1); }
.sprint-select-btn .sprint-btn-label { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; }
.sprint-select-btn svg { flex-shrink: 0; color: var(--text-muted); transition: transform 0.2s; }
.sprint-select-btn.open svg { transform: rotate(180deg); }
.sprint-select-btn .sprint-dot {
  width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
  background: var(--accent2); box-shadow: 0 0 5px var(--accent2);
}

.sprint-dropdown-menu {
  display: none; position: absolute;
  top: calc(100% + 6px); left: 0;
  min-width: 260px; max-height: 320px; overflow-y: auto;
  background: var(--surface2); border: 1px solid var(--border-bright);
  border-radius: var(--r-lg);
  box-shadow: 0 16px 48px rgba(0,0,0,0.5), 0 0 0 1px rgba(91,143,255,0.06);
  z-index: 200; animation: dropIn 0.18s ease both;
  scrollbar-width: thin; scrollbar-color: var(--border-bright) transparent;
}
.sprint-dropdown-menu.open { display: block; }
.sprint-dropdown-menu::-webkit-scrollbar { width: 4px; }
.sprint-dropdown-menu::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 2px; }

.sprint-menu-header {
  padding: 12px 14px 8px;
  font-size: 9px; font-weight: 600; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--text-dim);
  border-bottom: 1px solid var(--border);
  font-family: var(--font);
}
.sprint-menu-item {
  padding: 10px 14px; cursor: pointer;
  transition: background 0.1s;
  border-bottom: 1px solid rgba(37,43,66,0.4);
}
.sprint-menu-item:last-child { border-bottom: none; }
.sprint-menu-item:hover { background: rgba(91,143,255,0.06); }
.sprint-menu-item.active { background: rgba(91,143,255,0.1); }
.sprint-menu-item.active .smi-name { color: var(--accent); }
.smi-name { font-size: 13px; font-weight: 500; color: var(--text); font-family: var(--font); margin-bottom: 2px; }
.smi-dates { font-size: 10px; color: var(--text-dim); font-family: var(--mono); }

@media (max-width: 1100px) {
  .analytics-grid { grid-template-columns: 1fr 1fr; }
  .analytics-col-left { grid-column: 1 / -1; flex-direction: row; }
}
@media (max-width: 900px) {
  .analytics-grid { grid-template-columns: 1fr; }
  .analytics-col-left { flex-direction: column; }
  .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
  .topbar { flex-direction: column; align-items: flex-start; }
  .sprint-meta { gap: 16px; }
  .members-controls { flex-wrap: wrap; }
  .members-search { width: 160px; }
  .members-search:focus { width: 180px; }
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">QA</div>
    <div class="login-title">QA Performance Dashboard</div>
    <div class="login-sub">Sign in with your Google account to access<br>live ticket data from the CDS tracker.</div>
    <div class="login-divider"><span>continue with</span></div>
    <button id="googleSignInBtn" onclick="startOAuth()">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Sign in with Google
    </button>
    <div id="loginError"></div>
    <div class="login-note">
      Access is restricted to authorized accounts only.<br>
      Your credentials are never stored on this page.
    </div>
  </div>
</div>

<!-- LOADING -->
<div id="loadingScreen">
  <div class="loader-ring"></div>
  <div class="loader-text">Loading dashboard data…</div>
  <div class="loader-sub" id="loadStatus">Connecting to Google Sheets…</div>
</div>

<!-- DASHBOARD -->
<div id="dashboardRoot"></div>

<script>
/* ══════════════════════════════════════════════════
   CONSTANTS
══════════════════════════════════════════════════ */
const CLIENT_ID    = '972002611239-cgrk0bk448av6d6fen10rhbm7cpf9rvu.apps.googleusercontent.com';
const SHEET_ID     = '1HStlB0xNjCJWScZ35e_e1c7YxZ06huNqznfVUc-ZE5k';
const SHEET_TAB    = 'ALL TICKETS';
const TIMELINE_TAB = 'Timelines';
const DATA_RANGE   = 'C3:T';
const SCOPES       = 'https://www.googleapis.com/auth/spreadsheets.readonly';
const AVATAR_COLORS = ['#5b8fff','#b07fff','#00e5a8','#ffb84d','#ff5577','#3dd6f5','#f06292','#aed581','#ffb74d'];

let accessToken = null;
let currentUser = { name: 'User', email: '', initials: 'U' };
const STORAGE_KEY = 'qa_dash_session';

/* ── Sprint state ── */
let _sprints        = [];   // [{ name, start, end, startDate, endDate }]
let _selectedSprint = null; // current sprint object

/* ── Session helpers ── */
function saveSession() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ accessToken, user: currentUser, savedAt: Date.now() })); } catch(e) {}
}
function loadSession() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const s = JSON.parse(raw);
    if (!s.accessToken || (Date.now() - s.savedAt) > 55*60*1000) { localStorage.removeItem(STORAGE_KEY); return false; }
    accessToken = s.accessToken; currentUser = s.user || currentUser; return true;
  } catch(e) { return false; }
}
function clearSession() { try { localStorage.removeItem(STORAGE_KEY); } catch(e) {} }

/* ══════════════════════════════════════════════════
   OAUTH
══════════════════════════════════════════════════ */
let tokenClient = null;
const GOOGLE_BTN_HTML = '<svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg> Sign in with Google';

function startOAuth() {
  const btn = document.getElementById('googleSignInBtn');
  btn.disabled = true; btn.textContent = 'Connecting…';
  if (typeof google === 'undefined' || !google.accounts) {
    showLoginError('Google Sign-In library not loaded. Please refresh.'); resetSignInBtn(); return;
  }
  if (!tokenClient) {
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID, scope: SCOPES,
      callback: handleTokenResponse,
      error_callback: (err) => { showLoginError('Sign-in failed: ' + (err.message || JSON.stringify(err))); resetSignInBtn(); }
    });
  }
  tokenClient.requestAccessToken({ prompt: '' });
}
function handleTokenResponse(resp) {
  if (resp.error) { showLoginError('Authentication error: ' + resp.error); resetSignInBtn(); return; }
  accessToken = resp.access_token;
  fetch('https://www.googleapis.com/oauth2/v3/userinfo', { headers: { Authorization: 'Bearer ' + accessToken } })
    .then(r => r.json())
    .then(info => {
      currentUser.name     = info.name || info.email || 'User';
      currentUser.email    = info.email || '';
      currentUser.initials = (info.name || 'U').split(' ').slice(0,2).map(w => w[0]).join('').toUpperCase();
      saveSession(); loadDashboard();
    }).catch(() => { saveSession(); loadDashboard(); });
}
function resetSignInBtn() { const btn = document.getElementById('googleSignInBtn'); btn.disabled = false; btn.innerHTML = GOOGLE_BTN_HTML; }
function showLoginError(msg) { const el = document.getElementById('loginError'); el.textContent = '⚠ ' + msg; el.style.display = 'block'; }
function signOut() {
  if (accessToken && typeof google !== 'undefined') google.accounts.oauth2.revoke(accessToken, () => {});
  accessToken = null; clearSession();
  document.getElementById('dashboardRoot').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  resetSignInBtn();
}
window.addEventListener('DOMContentLoaded', () => { if (loadSession()) loadDashboard(); });

/* ══════════════════════════════════════════════════
   FETCH HELPERS
══════════════════════════════════════════════════ */
async function sheetFetch(rangeStr) {
  const range = encodeURIComponent(rangeStr);
  const url   = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${range}?valueRenderOption=FORMATTED_VALUE`;
  const res   = await fetch(url, { headers: { Authorization: 'Bearer ' + accessToken } });
  if (res.status === 401) { signOut(); throw new Error('Session expired. Please sign in again.'); }
  if (!res.ok) { const err = await res.json().catch(() => ({})); throw new Error(err?.error?.message || `HTTP ${res.status}`); }
  const data = await res.json();
  return data.values || [];
}

/* Fetch + parse Timelines sheet — returns array of sprint objects */
async function fetchTimelines() {
  const rows = await sheetFetch(`'${TIMELINE_TAB}'!A2:C`);
  return rows
    .filter(r => r[0] && r[0].trim())
    .map(r => {
      const name  = (r[0] || '').trim();
      const start = (r[1] || '').trim();
      const end   = (r[2] || '').trim();
      return {
        name,
        start,  // raw string for display
        end,
        startDate: parseAnyDate(start),
        endDate:   parseAnyDate(end),
      };
    });
}

/* Fetch ALL TICKETS raw rows (unfiltered) */
async function fetchSheetData() {
  return sheetFetch(`'${SHEET_TAB}'!${DATA_RANGE}`);
}

/* ── Date parsing ─────────────────────────────── */
// Handles: "January 15, 2025", "Jan 15, 2025", "Monday, January 15, 2025",
//          "2025-01-15", "01/15/2025", "15/01/2025", serial numbers
function parseAnyDate(str) {
  if (!str) return null;
  str = str.trim();
  // Google Sheets serial number (e.g. 45672)
  if (/^\d{4,6}$/.test(str)) {
    const serial = parseInt(str, 10);
    // Google epoch: Dec 30 1899
    return new Date(Date.UTC(1899, 11, 30) + serial * 86400000);
  }
  // Remove weekday prefix "Monday, " or "Mon, "
  const noDay = str.replace(/^\w+,\s*/, '');
  const d = new Date(noDay);
  if (!isNaN(d)) return d;
  // Try original
  const d2 = new Date(str);
  if (!isNaN(d2)) return d2;
  return null;
}

/* Normalise a date to midnight UTC for clean range comparisons */
function toMidnightUTC(d) {
  if (!d) return null;
  return new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
}

/* Return true if ticketDateStr falls within [startDate, endDate] inclusive */
function inSprintRange(ticketDateStr, startDate, endDate) {
  if (!startDate && !endDate) return true; // no filter
  const td = toMidnightUTC(parseAnyDate(ticketDateStr));
  if (!td) return false;
  const s = startDate ? toMidnightUTC(startDate) : null;
  const e = endDate   ? toMidnightUTC(endDate)   : null;
  if (s && td < s) return false;
  if (e && td > e) return false;
  return true;
}

/* ══════════════════════════════════════════════════
   PARSE TICKETS
══════════════════════════════════════════════════ */
function parseTickets(rows) {
  if (!rows.length) return [];
  const headers = rows[0].map(h => h.trim());
  const idx = h => headers.indexOf(h);
  const I = {
    id: idx('ID'), title: idx('Title'), author: idx('Author'), assignee: idx('Assignee'),
    labels: idx('Labels'), milestone: idx('Milestone'), status: idx('Status'),
    createdAt: idx('Created At'), closedAt: idx('Closed At'), closedBy: idx('Closed By'),
    project: idx('Project'), qaReviewer: idx('QA Reviewer'), reopened: idx('Reopened?'),
    localStatus: idx('Local Status'), passedOn: idx('Passed On'),
  };
  return rows.slice(1).map(row => {
    const g = i => (i >= 0 && i < row.length) ? (row[i] || '').trim() : '';
    return {
      id: g(I.id), title: g(I.title), author: g(I.author), assignee: g(I.assignee),
      labels: g(I.labels).split(',').map(l => l.trim()).filter(Boolean),
      milestone: g(I.milestone), status: g(I.status), createdAt: g(I.createdAt),
      closedAt: g(I.closedAt), closedBy: g(I.closedBy), project: g(I.project),
      qaReviewer: g(I.qaReviewer), reopened: g(I.reopened),
      localStatus: g(I.localStatus), passedOn: g(I.passedOn),
    };
  }).filter(t => t.id);
}

/* ══════════════════════════════════════════════════
   COMPUTE METRICS
══════════════════════════════════════════════════ */
function computeMetrics(tickets) {
  const total  = tickets.length;
  const closed = tickets.filter(t => t.status.toLowerCase() === 'closed').length;
  const open   = total - closed;

  // ── Exact-match label helpers ──────────────────
  // Labels are comma-separated; each label is already trimmed in parseTickets.
  // Use exact case-insensitive match against the full label string.
  const hasExactLabel = (t, name) =>
    t.labels.some(l => l.toLowerCase() === name.toLowerCase());

  // isBug: has "Bug-Issue" AND does NOT have "Not a Bug"
  const isBug = t =>
    hasExactLabel(t, 'Bug-Issue') && !hasExactLabel(t, 'Not a Bug');

  // isUsability: has "Usability Suggestions"
  const isUsability = t => hasExactLabel(t, 'Usability Suggestions');

  // isTestCase: has "Test Case"
  const isTestCase = t => hasExactLabel(t, 'Test Case');

  // getType now uses exact matching
  const getType = t => {
    if (isBug(t))        return 'Bug';
    if (isUsability(t))  return 'Usability';
    if (isTestCase(t))   return 'Test Case';
    return 'Other';
  };

  // Resolution rate: only Bug-Issue + Usability Suggestions tickets
  const bugAndUsabTickets = tickets.filter(t => isBug(t) || isUsability(t));
  const buClosed = bugAndUsabTickets.filter(t => t.status.toLowerCase() === 'closed').length;
  const buTotal  = bugAndUsabTickets.length;
  const resPct   = buTotal ? ((buClosed / buTotal) * 100).toFixed(1) + '%' : '0%';

  // ── Partial label helpers for other KPIs ──────
  const hasLabel = (t, s) => t.labels.some(l => l.toLowerCase().includes(s.toLowerCase()));

  const manualQA = tickets.filter(t => hasLabel(t, 'Manual QA For Review')).length;
  const autoQA   = tickets.filter(t => hasLabel(t, 'Automation') || hasLabel(t, 'For Automation')).length;
  const leadQA   = tickets.filter(t => hasLabel(t, 'QA Lead') || hasLabel(t, 'For QA Lead')).length;
  const reviewed = tickets.filter(t =>
    (t.localStatus || '').toLowerCase().includes('reviewed') || hasLabel(t, 'Reviewed Test Case')
  ).length;
  const changes = tickets.filter(t => (t.localStatus || '').toLowerCase().includes('changes requested')).length;
  const onHold  = tickets.filter(t => (t.localStatus || '').toLowerCase().includes('on hold')).length;

  const getPriority = t => {
    for (const l of t.labels) {
      const lc = l.toLowerCase();
      if (lc.includes('urgent') || lc === 'urg-priority') return 'urgent';
      if (lc.includes('high-priority') || lc === 'high') return 'high';
      if (lc.includes('medium-priority') || lc.includes('med-priority')) return 'medium';
      if (lc.includes('low-priority') || lc === 'low') return 'low';
    }
    // fallback: looser match
    for (const l of t.labels) {
      const lc = l.toLowerCase();
      if (lc.includes('urgent')) return 'urgent';
      if (lc.includes('high'))   return 'high';
      if (lc.includes('medium') || lc.includes('med')) return 'medium';
      if (lc.includes('low'))    return 'low';
    }
    return 'none';
  };
  const getSeverity = t => {
    for (const l of t.labels) {
      const lc = l.toLowerCase();
      if (lc.includes('critical')) return 'critical';
      if (lc.includes('major'))    return 'major';
      if (lc.includes('minor'))    return 'minor';
    }
    return 'none';
  };

  // Priority × Severity matrix
  const PRIO = ['low','medium','high','urgent'];
  const SEV  = ['minor','major','critical'];
  const PL   = { low:'Low', medium:'Med', high:'High', urgent:'Urg' };
  const SL   = { minor:'Minor', major:'Major', critical:'Critical' };
  const priorityCounts = [];
  for (const p of PRIO) for (const s of SEV) {
    const bugs      = tickets.filter(t => getPriority(t)===p && getSeverity(t)===s && isBug(t)).length;
    const usability = tickets.filter(t => getPriority(t)===p && getSeverity(t)===s && isUsability(t)).length;
    priorityCounts.push({ label:`${PL[p]}-${SL[s]}`, prio:p, bugs, usability });
  }

  // Milestones — exclude "QA Team"
  const msMap = {};
  for (const t of tickets) {
    const m = t.milestone || '(No Milestone)';
    if (m.trim().toLowerCase() === 'qa team') continue; // skip QA Team milestone
    if (!msMap[m]) msMap[m] = { open:0, closed:0, bugs:0, usability:0 };
    t.status.toLowerCase()==='closed' ? msMap[m].closed++ : msMap[m].open++;
    if (isBug(t))       msMap[m].bugs++;
    if (isUsability(t)) msMap[m].usability++;
  }
  const milestones = Object.entries(msMap)
    .map(([name,v]) => ({name,...v}))
    .sort((a,b) => (b.open+b.closed)-(a.open+a.closed))
    .slice(0, 10);
  const msTotal = milestones.reduce((acc,m) => ({
    open: acc.open+m.open, closed: acc.closed+m.closed,
    bugs: acc.bugs+m.bugs, usability: acc.usability+m.usability,
  }), {open:0,closed:0,bugs:0,usability:0});

  // Members — total = bug + usability only (Top Reporters counts)
  const memberMap = {};
  const bump = (key, field) => {
    if (!key) return;
    if (!memberMap[key]) memberMap[key] = {bug:0,usability:0,bugReview:0,reopen:0,testCase:0,closed:0,low:0,med:0,high:0,urg:0,total:0};
    memberMap[key][field]++;
  };
  for (const t of tickets) {
    const a    = t.author || 'Unknown';
    const prio = getPriority(t);
    const bug  = isBug(t);
    const usab = isUsability(t);
    const tc   = isTestCase(t);
    if (bug)  bump(a,'bug');
    if (usab) bump(a,'usability');
    if (tc)   bump(a,'testCase');
    if (t.labels.some(l=>l.toLowerCase().includes('bug review'))) bump(a,'bugReview');
    if (t.reopened.toLowerCase()==='yes') bump(a,'reopen');
    if (t.status.toLowerCase()==='closed') bump(a,'closed');
    if (prio==='low')    bump(a,'low');
    if (prio==='medium') bump(a,'med');
    if (prio==='high')   bump(a,'high');
    if (prio==='urgent') bump(a,'urg');
    // total = Bug-Issue + Usability Suggestions only (for Top Reporters)
    if (bug || usab) bump(a,'total');
  }
  const members = Object.entries(memberMap)
    .map(([name,v]) => ({name,...v}))
    .sort((a,b) => b.total-a.total);
  const memberTotals = members.reduce((acc,m) => {
    for (const k of Object.keys(m)) if (k!=='name') acc[k]=(acc[k]||0)+m[k];
    return acc;
  }, {});

  // Distribution — based on exact types
  const bugCount    = tickets.filter(t=>isBug(t)).length;
  const usabCount   = tickets.filter(t=>isUsability(t)).length;
  const tcCount     = tickets.filter(t=>isTestCase(t)).length;
  const bugRevCount = tickets.filter(t=>t.labels.some(l=>l.toLowerCase().includes('bug review'))).length;
  const reopenCount = tickets.filter(t=>t.reopened.toLowerCase()==='yes').length;
  const distTotal   = bugCount+usabCount+tcCount+bugRevCount+reopenCount || 1;
  const pct = v => ((v/distTotal)*100).toFixed(1);
  const donut = [
    { label:'Test Case',         value:tcCount,    pct:pct(tcCount),    color:'#5b8fff' },
    { label:'Bug Review',        value:bugRevCount,pct:pct(bugRevCount),color:'#00e5a8' },
    { label:'Bug-Issue',         value:bugCount,   pct:pct(bugCount),   color:'#ffb84d' },
    { label:'Usability Suggest.',value:usabCount,  pct:pct(usabCount),  color:'#b07fff' },
    { label:'Reopen',            value:reopenCount,pct:pct(reopenCount),color:'#ff5577' },
    { label:'Closed',            value:closed,     pct:pct(closed),     color:'#3a4260' },
  ];

  // Sprint dates — come from the selected sprint dropdown
  const sprintName  = _selectedSprint ? _selectedSprint.name  : (milestones.length ? milestones[0].name : 'Current Sprint');
  const sprintStart = _selectedSprint ? _selectedSprint.start : '';
  const sprintEnd   = _selectedSprint ? _selectedSprint.end   : '';
  let totalDays = 0, remainingDays = 0;
  if (_selectedSprint && _selectedSprint.startDate && _selectedSprint.endDate) {
    const now = new Date();
    totalDays     = Math.max(1, Math.round((_selectedSprint.endDate - _selectedSprint.startDate) / 86400000));
    remainingDays = Math.max(0, Math.round((_selectedSprint.endDate - now) / 86400000));
  }

  const kpis = [
    { label:'Resolution Rate',     value:resPct,           sub:`${buClosed} of ${buTotal} bug/usab closed`, color:'c-warn'   },
    { label:'Tickets Created',     value:String(total),    sub:'This sprint',                               color:'c-accent' },
    { label:'Tickets Closed',      value:String(closed),   sub:`${open} remaining open`,                    color:'c-green'  },
    { label:'For Manual QA',       value:String(manualQA), sub:'Pending review',                            color:'c-accent' },
    { label:'For Automation',      value:String(autoQA),   sub:'Awaiting automation QA',                    color:'c-purple' },
    { label:'For QA Lead',         value:String(leadQA),   sub:'Needs lead sign-off',                       color:'c-warn'   },
    { label:'Reviewed Test Cases', value:String(reviewed), sub:'Completed reviews',                         color:'c-green'  },
    { label:'Changes Requested',   value:String(changes),  sub:'Revisions needed',                          color:'c-danger' },
    { label:'On Hold',             value:String(onHold),   sub:'Suspended tickets',                         color:'c-danger' },
  ];

  return {
    total, closed, open, kpis,
    priorityCounts, milestones, msTotal,
    members, memberTotals,
    reporters: members.slice(0,6),
    donut,
    sprintName, sprintStart, sprintEnd, totalDays, remainingDays,
  };
}

/* ══════════════════════════════════════════════════
   HELPERS
══════════════════════════════════════════════════ */
function avatarColor(name) {
  let h = 0;
  for (const c of name) h = (h*31 + c.charCodeAt(0)) % AVATAR_COLORS.length;
  return AVATAR_COLORS[Math.abs(h)];
}
function initials(name) { return (name||'').split(' ').slice(0,2).map(w=>w[0]||'').join('').toUpperCase(); }
function n(v) { return (v===0||v==='0') ? `<span class="zero">—</span>` : v; }
function priClass(label) {
  if (label.startsWith('Urg'))  return 'p-urg';
  if (label.startsWith('High')) return 'p-high';
  if (label.startsWith('Med'))  return 'p-med';
  return 'p-low';
}

   MEMBERS SECTION — INTERACTIVE LOGIC

let _allMembers   = [];
let _memberTotals = {};
let _sortField    = null;
let _sortOpen     = false;
let _searchQuery  = '';

function initMembersSection(members, memberTotals) {
  _allMembers   = members;
  _memberTotals = memberTotals;
  _sortField    = null;
  _searchQuery  = '';
  _sortOpen     = false;
  renderMembersSection();
}

function getSortedFilteredMembers() {
  let list = [..._allMembers];
  if (_searchQuery.trim()) {
    const q = _searchQuery.toLowerCase().trim();
    list = list.filter(m => m.name.toLowerCase().includes(q));
  }
  if (_sortField) {
    list = list.sort((a, b) => (b[_sortField] || 0) - (a[_sortField] || 0));
  }
  return list;
}

function hasActiveSort() {
  return _sortField !== null;
}

function memberRowHTML(m) {
  const av = avatarColor(m.name);
  const highlight = (field) =>
    _sortField === field ? 'style="color:var(--text);font-weight:600"' : '';
  return `<tr>
    <td><div class="member-cell">
      <div class="avatar" style="background:${av}22;color:${av}">${initials(m.name)}</div>
      <span style="font-size:12px;font-family:var(--font)">${m.name}</span>
    </div></td>
    <td ${highlight('bug')}>${n(m.bug)}</td>
    <td ${highlight('usability')}>${n(m.usability)}</td>
    <td ${highlight('bugReview')}>${n(m.bugReview)}</td>
    <td ${highlight('reopen')}>${n(m.reopen)}</td>
    <td ${highlight('testCase')}>${n(m.testCase)}</td>
    <td ${highlight('closed')}>${n(m.closed)}</td>
    <td style="color:var(--low);${_sortField==='low'?'font-weight:600':''}">${n(m.low)}</td>
    <td style="color:var(--med);${_sortField==='med'?'font-weight:600':''}">${n(m.med)}</td>
    <td style="color:var(--high);${_sortField==='high'?'font-weight:600':''}">${n(m.high)}</td>
    <td style="color:var(--urg);${_sortField==='urg'?'font-weight:600':''}">${n(m.urg)}</td>
    <td style="font-weight:${_sortField==='total'?'700':'500'};color:var(--text)">${m.total}</td>
  </tr>`;
}

function sortOptionHTML(value, label, color) {
  const isActive = _sortField === value;
  return `
  <div class="sort-option${isActive ? ' checked' : ''}" onclick="selectSort('${value}')">
    <div class="sort-radio"></div>
    ${color ? `<div class="sort-dot" style="background:${color}"></div>` : ''}
    <div class="sort-option-label">${label}</div>
    ${isActive ? `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--accent2)" stroke-width="2.5" style="flex-shrink:0"><polyline points="6 9 12 15 18 9"/></svg>` : ''}
  </div>`;
}

function selectSort(field) {
  _sortField = (_sortField === field) ? null : field;
  renderMembersSection();
}

function applyFilters() {
  _sortOpen = false;
  renderMembersSection();
}

function clearAllFilters() {
  _sortField   = null;
  _searchQuery = '';
  _sortOpen    = false;
  renderMembersSection();
}

function onMembersSearch(val) {
  _searchQuery = val;
  renderMembersSection();
  const el = document.getElementById('membersSearch');
  if (el) { el.focus(); el.setSelectionRange(val.length, val.length); }
}

function toggleFilterDropdown() {
  _sortOpen = !_sortOpen;
  const dd  = document.getElementById('filterDropdown');
  const btn = document.getElementById('filterBtn');
  if (dd)  dd.classList.toggle('open', _sortOpen);
  if (btn) btn.classList.toggle('active', _sortOpen || hasActiveSort());
}

function setupFilterDropdownClose() {
  setTimeout(() => {
    const handler = (e) => {
      const wrap = document.getElementById('filterWrap');
      if (wrap && !wrap.contains(e.target)) {
        _sortOpen = false;
        const dd = document.getElementById('filterDropdown');
        if (dd) dd.classList.remove('open');
        document.removeEventListener('click', handler);
      }
    };
    document.addEventListener('click', handler);
  }, 10);
}

function renderDashboard(metrics) {
  const { total, closed, kpis, priorityCounts, milestones, msTotal,
          members, memberTotals, reporters, donut,
          sprintName, sprintStart, sprintEnd, totalDays, remainingDays } = metrics;

  const elapsed    = totalDays - remainingDays;
  const pctElapsed = totalDays ? Math.min(100, Math.round((elapsed/totalDays)*100)) : 0;

  /* ── Topbar ── */
  const topbar = `
<div class="topbar slide-up">
  <div class="brand">
    <div class="brand-logo">QA</div>
    <div>
      <div class="brand-name">QA Performance Dashboard</div>

</div>`;

  /* ── Announce ── */
  const announce = `
<div class="announce fade-in">
  <div class="announce-dot"></div>
  <span>Live data · ${total} tickets loaded · Last refreshed ${new Date().toLocaleTimeString()}</span>
</div>`;

  /* ── KPIs ── */
  const kpiHtml = kpis.map((k,i) => `
<div class="kpi ${k.color} slide-up" style="animation-delay:${i*0.04}s">
  <div class="kpi-label">${k.label}</div>
  <div class="kpi-value">${k.value}</div>
  <div class="kpi-sub">${k.sub}</div>
</div>`).join('');

  const kpiSection = `
<div>
  <div class="section-label">Sprint Metrics</div>
  <div class="grid-auto">${kpiHtml}</div>
</div>`;

  /* ── Priority matrix ── */

    const bw = Math.round((r.bugs/maxBug)*100);

      <div style="display:flex;gap:16px;margin-bottom:14px">
        <span style="font-size:11px;color:var(--warn);display:flex;align-items:center;gap:5px;font-family:var(--font)"><span style="width:8px;height:8px;border-radius:50%;background:var(--warn);display:inline-block"></span>Bug</span>
        <span style="font-size:11px;color:var(--accent);display:flex;align-items:center;gap:5px;font-family:var(--font)"><span style="width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block"></span>Usability</span>
      </div>
      <div style="display:grid;grid-template-columns:110px 1fr 1fr 44px 44px;gap:8px;padding-bottom:8px;border-bottom:1px solid var(--border);margin-bottom:4px">
        <div style="font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.08em;font-family:var(--font)">Priority</div>
        <div style="font-size:10px;color:var(--warn);text-transform:uppercase;letter-spacing:0.08em;font-family:var(--font)">Bug</div>
        <div style="font-size:10px;color:var(--accent);text-transform:uppercase;letter-spacing:0.08em;font-family:var(--font)">Usab.</div>
        <div></div><div></div>
      </div>
      ${matrixRows}
      <div style="display:grid;grid-template-columns:110px 1fr 1fr 44px 44px;gap:8px;padding-top:10px;border-top:1px solid var(--border-bright);margin-top:4px">
        <div style="font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.08em;font-family:var(--font)">Total</div>
        <div></div><div></div>
        <div style="text-align:right;font-family:var(--mono);font-size:12px;color:var(--warn);font-weight:500">${totalBugs}</div>
        <div style="text-align:right;font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:500">${totalUsab}</div>
      </div>
    </div>

    <!-- COL 3: Milestones -->
    <div class="card">
      <div class="card-title">Milestones — Open vs Closed</div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th style="text-align:left">Milestone</th>
            <th>Open</th><th>Closed</th><th>Bugs</th><th>Usab.</th>
          </tr></thead>
          <tbody>${msRows}</tbody>
          <tfoot><tr>
            <td>Total</td>
            <td>${msTotal.open}</td><td>${msTotal.closed}</td>
            <td>${msTotal.bugs}</td><td>${msTotal.usability}</td>
          </tr></tfoot>
        </table>
      </div>
    </div>

  </div>
</div>`;

  /* ── Members section placeholder ── */
  const membersSection = `<div id="membersCardContainer"></div>`;

  const footer = `
<div style="text-align:center;padding:20px 0 8px;font-size:11px;color:var(--text-dim);position:relative;z-index:1;font-family:var(--font)">
  QA Performance Dashboard · ${new Date().toLocaleDateString()} · ${currentUser.email}
</div>`;

  document.getElementById('dashboardRoot').innerHTML = `
<div class="dash">
  ${topbar}
  ${announce}
  ${kpiSection}
  ${chartsSection}
  ${membersSection}
  ${footer}
</div>`;

  initMembersSection(members, memberTotals);
}

/* ══════════════════════════════════════════════════
   ORCHESTRATOR
══════════════════════════════════════════════════ */
function setStatus(msg) { document.getElementById('loadStatus').textContent = msg; }

async function loadDashboard() {
  document.getElementById('loginScreen').style.display   = 'none';
  document.getElementById('loadingScreen').style.display = 'flex';
  document.getElementById('dashboardRoot').style.display = 'none';
  try {
    setStatus('Fetching ticket data from Google Sheets…');
    const rows = await fetchSheetData();
    if (!rows || rows.length < 2) throw new Error('No data found in ALL TICKETS tab.');
    setStatus(`Parsing ${rows.length - 1} ticket(s)…`);
    const tickets = parseTickets(rows);
    if (!tickets.length) throw new Error('Could not parse any tickets. Check that row 3 has the correct headers.');
    setStatus('Computing metrics…');
    const metrics = computeMetrics(tickets);
    setStatus('Rendering dashboard…');
    document.getElementById('loadingScreen').style.display = 'none';
    document.getElementById('dashboardRoot').style.display = 'block';
    renderDashboard(metrics);
  } catch (err) {
    document.getElementById('loadingScreen').style.display = 'none';
    if (accessToken) {
      document.getElementById('dashboardRoot').innerHTML = `
<div class="dash">
  <div class="err-banner">⚠ ${err.message || String(err)}<br><br>
    <button class="btn" onclick="loadDashboard()">↺ Retry</button>
    <button class="btn btn-danger" onclick="signOut()" style="margin-left:8px">Sign out</button>
  </div>
</div>`;
      document.getElementById('dashboardRoot').style.display = 'block';
    }
    console.error(err);
  }
}
</script>
