<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QA Performance Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root {
  --bg: #07090f;
  --bg2: #0c0f1a;
  --surface: #111520;
  --surface2: #181d2e;
  --surface3: #1e2438;
  --border: #252b42;
  --border-bright: #323c5c;
  --text: #e4e9f7;
  --text-muted: #6b778f;
  --text-dim: #3a4260;
  --accent: #5b8fff;
  --accent2: #00e5a8;
  --warn: #ffb84d;
  --danger: #ff5577;
  --purple: #b07fff;
  --low: #5b8fff;
  --med: #b07fff;
  --high: #ffb84d;
  --urg: #ff5577;
  --font: 'Syne', sans-serif;
  --mono: 'DM Mono', monospace;
  --r: 10px;
  --r-lg: 16px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.6;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── Noise texture overlay ── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 0;
  opacity: 0.5;
}

/* ── Grid lines background ── */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(91,143,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(91,143,255,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}

/* ══════════════════════════════════════
   LOGIN SCREEN
══════════════════════════════════════ */
#loginScreen {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 100; gap: 0;
  background: var(--bg);
}

.login-card {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--border-bright);
  border-radius: 20px;
  padding: 48px 48px 40px;
  width: 100%; max-width: 440px;
  text-align: center;
  box-shadow: 0 0 80px rgba(91,143,255,0.08), 0 0 0 1px rgba(91,143,255,0.1);
  animation: fadeUp 0.6s ease both;
}

.login-card::before {
  content: '';
  position: absolute;
  top: -1px; left: 50%; transform: translateX(-50%);
  width: 60%; height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  border-radius: 2px;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}

.login-logo {
  width: 64px; height: 64px;
  background: linear-gradient(135deg, var(--accent), #3a6de0);
  border-radius: 18px;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 24px;
  font-family: var(--mono); font-size: 22px; font-weight: 500;
  color: #fff;
  box-shadow: 0 8px 32px rgba(91,143,255,0.3);
}

.login-title {
  font-size: 22px; font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 8px;
}

.login-sub {
  font-size: 13px; color: var(--text-muted);
  margin-bottom: 32px; line-height: 1.5;
}

.login-divider {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 24px;
}
.login-divider::before, .login-divider::after {
  content: ''; flex: 1; height: 1px; background: var(--border);
}
.login-divider span { font-size: 11px; color: var(--text-dim); letter-spacing: 0.1em; text-transform: uppercase; }

#googleSignInBtn {
  width: 100%;
  display: flex; align-items: center; justify-content: center; gap: 12px;
  padding: 14px 20px;
  background: var(--surface2);
  border: 1px solid var(--border-bright);
  border-radius: var(--r);
  color: var(--text);
  font-family: var(--font); font-size: 14px; font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
}
#googleSignInBtn:hover {
  background: var(--surface3);
  border-color: var(--accent);
  box-shadow: 0 0 20px rgba(91,143,255,0.12);
}
#googleSignInBtn svg { flex-shrink: 0; }

.login-note {
  margin-top: 20px;
  font-size: 11px; color: var(--text-dim); line-height: 1.6;
}

#loginError {
  display: none;
  margin-top: 16px;
  padding: 10px 14px;
  background: rgba(255,85,119,0.08);
  border: 1px solid rgba(255,85,119,0.25);
  border-radius: var(--r);
  font-size: 12px; color: #ff8099;
  text-align: left;
}

/* ══════════════════════════════════════
   LOADING
══════════════════════════════════════ */
#loadingScreen {
  position: fixed; inset: 0;
  display: none; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 99; gap: 20px;
  background: var(--bg);
}

.loader-ring {
  width: 48px; height: 48px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.75s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.loader-text { font-family: var(--mono); font-size: 13px; color: var(--text-muted); }
.loader-sub  { font-size: 11px; color: var(--text-dim); }

/* ══════════════════════════════════════
   DASHBOARD LAYOUT
══════════════════════════════════════ */
#dashboardRoot { display: none; position: relative; z-index: 1; }

.dash { max-width: 1440px; margin: 0 auto; padding: 24px 20px; display: grid; gap: 16px; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
.grid-auto { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }

/* ── Cards ── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 22px;
  position: relative;
  transition: border-color 0.2s;
}
.card:hover { border-color: var(--border-bright); }

.card-title {
  font-size: 10px; font-weight: 600;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--text-dim); margin-bottom: 18px;
}

/* ── Header ── */
.topbar {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 18px 24px;
  display: flex; align-items: center;
  justify-content: space-between;
  gap: 20px; flex-wrap: wrap;
}

.brand { display: flex; align-items: center; gap: 14px; }
.brand-logo {
  width: 44px; height: 44px;
  background: linear-gradient(135deg, var(--accent), #3a6de0);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 15px; font-weight: 500; color: #fff;
  box-shadow: 0 4px 16px rgba(91,143,255,0.25);
  flex-shrink: 0;
}
.brand-name { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
.brand-sub  { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

.sprint-meta { display: flex; align-items: center; gap: 28px; flex-wrap: wrap; }
.meta-block .label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; }
.meta-block .val   { font-size: 13px; font-weight: 500; margin-top: 2px; }

.progress-track { height: 5px; background: var(--surface2); border-radius: 3px; margin-top: 6px; width: 120px; overflow: hidden; }
.progress-fill  { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 3px; transition: width 1s ease; }

.topbar-actions { display: flex; gap: 8px; align-items: center; }

.user-chip {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 12px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 999px; font-size: 12px; color: var(--text-muted);
}
.user-avatar {
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--accent); display: flex;
  align-items: center; justify-content: center;
  font-size: 9px; font-weight: 600; color: #fff;
}

.btn {
  padding: 8px 16px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: var(--r); color: var(--text-muted);
  font-family: var(--font); font-size: 12px; font-weight: 500;
  cursor: pointer; transition: all 0.2s;
}
.btn:hover { border-color: var(--accent); color: var(--text); }
.btn-danger:hover { border-color: var(--danger); color: var(--danger); }

/* ── Announce banner ── */
.announce {
  background: rgba(91,143,255,0.06);
  border: 1px solid rgba(91,143,255,0.2);
  border-radius: var(--r);
  padding: 10px 16px;
  font-size: 12px; color: #7da4ff;
  display: flex; align-items: center; gap: 10px;
}
.announce-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent2);
  box-shadow: 0 0 6px var(--accent2);
  flex-shrink: 0;
  animation: pulse 2s ease infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* ── KPI cards ── */
.kpi {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 20px;
  position: relative; overflow: hidden;
}
.kpi::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0; height: 1px;
  opacity: 0.6;
}
.kpi.c-accent  { border-top: 2px solid var(--accent);  }
.kpi.c-green   { border-top: 2px solid var(--accent2); }
.kpi.c-warn    { border-top: 2px solid var(--warn);    }
.kpi.c-danger  { border-top: 2px solid var(--danger);  }
.kpi.c-purple  { border-top: 2px solid var(--purple);  }

.kpi-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 12px; font-weight: 600; }
.kpi-value { font-family: var(--mono); font-size: 30px; font-weight: 400; line-height: 1; color: var(--text); }
.kpi-sub   { font-size: 11px; color: var(--text-dim); margin-top: 10px; }

/* ── Section label ── */
.section-label {
  font-size: 10px; text-transform: uppercase;
  letter-spacing: 0.12em; color: var(--text-dim);
  display: flex; align-items: center; gap: 12px; margin-bottom: 4px;
}
.section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* ── Tables ── */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
thead th {
  text-align: right;
  font-size: 10px; font-weight: 600;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--text-dim); padding: 8px 10px;
  border-bottom: 1px solid var(--border);
}
thead th:first-child { text-align: left; }
tbody tr {
  border-bottom: 1px solid rgba(37,43,66,0.6);
  transition: background 0.12s;
}
tbody tr:hover { background: rgba(255,255,255,0.02); }
tbody td {
  padding: 9px 10px; text-align: right;
  color: var(--text-muted); font-family: var(--mono); font-size: 12px;
}
tbody td:first-child {
  text-align: left; font-family: var(--font);
  font-size: 13px; color: var(--text);
}
tfoot td {
  padding: 10px 10px; text-align: right;
  font-weight: 500; font-family: var(--mono); font-size: 12px;
  color: var(--text); border-top: 1px solid var(--border-bright);
}
tfoot td:first-child {
  text-align: left; font-size: 10px;
  text-transform: uppercase; letter-spacing: 0.08em;
}

.zero { color: var(--text-dim) !important; }

/* ── Priority labels ── */
.p-tag {
  display: inline-block; padding: 2px 8px;
  border-radius: 4px; font-size: 10px; font-weight: 500;
  font-family: var(--mono); letter-spacing: 0.04em;
}
.p-low  { background: rgba(91,143,255,0.12); color: #7da4ff; }
.p-med  { background: rgba(176,127,255,0.12); color: #c9a8ff; }
.p-high { background: rgba(255,184,77,0.12);  color: #ffd080; }
.p-urg  { background: rgba(255,85,119,0.12);  color: #ff8099; }

/* ── Member table avatar ── */
.avatar {
  width: 28px; height: 28px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 600; flex-shrink: 0;
  margin-right: 9px; vertical-align: middle;
}
.member-cell { display: flex; align-items: center; }

/* ── Bar charts ── */
.bar-track { height: 8px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
.bar-fill  { height: 100%; border-radius: 2px; transition: width 0.8s ease; }

.rep-row { display: grid; grid-template-columns: 130px 1fr 36px; align-items: center; gap: 10px; margin-bottom: 10px; }
.rep-name { font-size: 12px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ── Distribution legend ── */
.dist-item { display: flex; align-items: center; gap: 10px; margin-bottom: 11px; }
.dist-dot  { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.dist-label { flex: 1; font-size: 12px; color: var(--text-muted); }
.dist-count { font-family: var(--mono); font-size: 12px; color: var(--text); }
.dist-pct   { font-family: var(--mono); font-size: 11px; color: var(--text-dim); min-width: 44px; text-align: right; }

/* ── Priority matrix ── */
.matrix-row {
  display: grid;
  grid-template-columns: 110px 1fr 1fr 44px 44px;
  align-items: center; gap: 8px;
  padding: 5px 0;
  border-bottom: 1px solid rgba(37,43,66,0.5);
}
.matrix-row:last-child { border-bottom: none; }

/* ── Issue list ── */
.issue-item { padding: 13px 0; border-bottom: 1px solid rgba(37,43,66,0.5); }
.issue-item:last-child { border-bottom: none; }
.issue-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
.issue-title { font-size: 13px; color: var(--text); line-height: 1.4; }
.issue-path { font-size: 11px; color: var(--text-dim); margin-top: 3px; font-family: var(--mono); }

/* ── Animations ── */
.fade-in { animation: fadeIn 0.5s ease both; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.slide-up { animation: slideUp 0.5s ease both; }
@keyframes slideUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── Error banner ── */
.err-banner {
  background: rgba(255,85,119,0.08);
  border: 1px solid rgba(255,85,119,0.25);
  border-radius: var(--r); padding: 12px 16px;
  font-size: 12px; color: #ff8099;
}

@media (max-width: 900px) {
  .grid-2, .grid-3 { grid-template-columns: 1fr; }
  .topbar { flex-direction: column; align-items: flex-start; }
  .sprint-meta { gap: 16px; }
}
</style>
</head>
<body>

<!-- ══ LOGIN ══ -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">QA</div>
    <div class="login-title">QA Performance Dashboard</div>
    <div class="login-sub">Sign in with your Google account to access<br>live ticket data from the CDS tracker.</div>
    <div class="login-divider"><span>continue with</span></div>
    <button id="googleSignInBtn" onclick="startOAuth()">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Sign in with Google
    </button>
    <div id="loginError"></div>
    <div class="login-note">
      Access is restricted to authorized accounts only.<br>
      Your credentials are never stored on this page.
    </div>
  </div>
</div>

<!-- ══ LOADING ══ -->
<div id="loadingScreen">
  <div class="loader-ring"></div>
  <div class="loader-text">Loading dashboard data…</div>
  <div class="loader-sub" id="loadStatus">Connecting to Google Sheets…</div>
</div>

<!-- ══ DASHBOARD ══ -->
<div id="dashboardRoot"></div>

<script>
/* ══════════════════════════════════════════════════
   CONSTANTS
══════════════════════════════════════════════════ */
const CLIENT_ID      = '972002611239-cgrk0bk448av6d6fen10rhbm7cpf9rvu.apps.googleusercontent.com';
const SHEET_ID       = '1HStlB0xNjCJWScZ35e_e1c7YxZ06huNqznfVUc-ZE5k';
const SHEET_TAB      = 'ALL TICKETS';
const DATA_RANGE     = 'C3:T';
const SCOPES         = 'https://www.googleapis.com/auth/spreadsheets.readonly';

const AVATAR_COLORS  = ['#5b8fff','#b07fff','#00e5a8','#ffb84d','#ff5577','#3dd6f5','#f06292','#aed581','#ffb74d'];

let accessToken = null;
let currentUser = { name: 'User', email: '', initials: 'U' };

/* ══════════════════════════════════════════════════
   OAUTH — Google Identity Services (GIS)
══════════════════════════════════════════════════ */
let tokenClient = null;

function startOAuth() {
  const btn = document.getElementById('googleSignInBtn');
  btn.disabled = true;
  btn.textContent = 'Connecting…';

  // Load GIS if not yet loaded
  if (typeof google === 'undefined' || !google.accounts) {
    showLoginError('Google Sign-In library not loaded. Please refresh the page.');
    btn.disabled = false;
    btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg> Sign in with Google`;
    return;
  }

  if (!tokenClient) {
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: SCOPES,
      callback: handleTokenResponse,
      error_callback: (err) => {
        showLoginError('Sign-in failed: ' + (err.message || JSON.stringify(err)));
        resetSignInBtn();
      }
    });
  }

  tokenClient.requestAccessToken({ prompt: 'consent' });
}

function handleTokenResponse(resp) {
  if (resp.error) {
    showLoginError('Authentication error: ' + resp.error);
    resetSignInBtn();
    return;
  }
  accessToken = resp.access_token;

  // Get user info
  fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
    headers: { Authorization: 'Bearer ' + accessToken }
  })
  .then(r => r.json())
  .then(info => {
    currentUser.name     = info.name || info.email || 'User';
    currentUser.email    = info.email || '';
    currentUser.initials = (info.name || 'U').split(' ').slice(0,2).map(w => w[0]).join('').toUpperCase();
    loadDashboard();
  })
  .catch(() => loadDashboard());
}

function handleTokenError(err) {
  showLoginError('Sign-in failed. Please try again.');
  resetSignInBtn();
}

function resetSignInBtn() {
  const btn = document.getElementById('googleSignInBtn');
  btn.disabled = false;

function signOut() {

/* ══════════════════════════════════════════════════
   FETCH SHEET DATA
══════════════════════════════════════════════════ */
async function fetchSheetData() {
  const range = encodeURIComponent(`'${SHEET_TAB}'!${DATA_RANGE}`);
  const url   = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${range}?valueRenderOption=FORMATTED_VALUE`;

  const res = await fetch(url, {
    headers: { Authorization: 'Bearer ' + accessToken }
  });

  if (res.status === 401) {
    signOut();
    throw new Error('Session expired. Please sign in again.');
  }
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err?.error?.message || `HTTP ${res.status}`);
  }

  const data = await res.json();
  return data.values || [];
}

/* ══════════════════════════════════════════════════
   PARSE TICKETS
══════════════════════════════════════════════════ */
function parseTickets(rows) {
  if (!rows.length) return [];
  const headers = rows[0].map(h => h.trim());
  const idx = h => headers.indexOf(h);

  const I = {
    id:          idx('ID'),
    title:       idx('Title'),
    author:      idx('Author'),
    assignee:    idx('Assignee'),
    labels:      idx('Labels'),
    milestone:   idx('Milestone'),
    status:      idx('Status'),
    createdAt:   idx('Created At'),
    closedAt:    idx('Closed At'),
    closedBy:    idx('Closed By'),
    project:     idx('Project'),
    qaReviewer:  idx('QA Reviewer'),
    reopened:    idx('Reopened?'),
    localStatus: idx('Local Status'),
    passedOn:    idx('Passed On'),
  };

  return rows.slice(1).map(row => {
    const g = i => (i >= 0 && i < row.length) ? (row[i] || '').trim() : '';
    return {
      id:          g(I.id),
      title:       g(I.title),
      author:      g(I.author),
      assignee:    g(I.assignee),
      labels:      g(I.labels).split(',').map(l => l.trim()).filter(Boolean),
      milestone:   g(I.milestone),
      status:      g(I.status),
      createdAt:   g(I.createdAt),
      closedAt:    g(I.closedAt),
      closedBy:    g(I.closedBy),
      project:     g(I.project),
      qaReviewer:  g(I.qaReviewer),
      reopened:    g(I.reopened),
      localStatus: g(I.localStatus),
      passedOn:    g(I.passedOn),
    };
  }).filter(t => t.id);
}

/* ══════════════════════════════════════════════════
   COMPUTE METRICS
══════════════════════════════════════════════════ */
function computeMetrics(tickets) {
  const total   = tickets.length;
  const closed  = tickets.filter(t => t.status.toLowerCase() === 'closed').length;
  const open    = total - closed;
  const resPct  = total ? ((closed / total) * 100).toFixed(1) + '%' : '0%';

  const hasLabel = (t, s) => t.labels.some(l => l.toLowerCase().includes(s.toLowerCase()));

  const manualQA = tickets.filter(t => hasLabel(t, 'Manual QA For Review')).length;
  const autoQA   = tickets.filter(t => hasLabel(t, 'Automation') || hasLabel(t, 'For Automation')).length;
  const leadQA   = tickets.filter(t => hasLabel(t, 'QA Lead') || hasLabel(t, 'For QA Lead')).length;
  const reviewed = tickets.filter(t =>
    (t.localStatus || '').toLowerCase().includes('reviewed') ||
    hasLabel(t, 'Reviewed Test Case')
  ).length;
  const changes  = tickets.filter(t => (t.localStatus || '').toLowerCase().includes('changes requested')).length;
  const onHold   = tickets.filter(t => (t.localStatus || '').toLowerCase().includes('on hold')).length;

  const getPriority = t => {
    for (const l of t.labels) {
      const lc = l.toLowerCase();
      if (lc.includes('urgent') || lc.includes('urg')) return 'urgent';
      if (lc.includes('high'))   return 'high';
      if (lc.includes('medium') || lc.includes('med')) return 'medium';
      if (lc.includes('low'))    return 'low';
    }
    return 'none';
  };

  const getSeverity = t => {
    for (const l of t.labels) {
      const lc = l.toLowerCase();
      if (lc.includes('critical')) return 'critical';
      if (lc.includes('major'))    return 'major';
      if (lc.includes('minor'))    return 'minor';
    }
    return 'none';
  };

  const getType = t => {
    if (t.labels.some(l => l.toLowerCase().includes('test case')))  return 'Test Case';
    if (t.labels.some(l => l.toLowerCase().includes('usability'))) return 'Usability';
    if (t.labels.some(l => l.toLowerCase().includes('bug')))       return 'Bug';
    return 'Other';
  };

  // Priority × Severity matrix
  const PRIO  = ['low','medium','high','urgent'];
  const SEV   = ['minor','major','critical'];
  const PL    = { low:'Low', medium:'Med', high:'High', urgent:'Urg' };
  const SL    = { minor:'Minor', major:'Major', critical:'Critical' };

  const priorityCounts = [];
  for (const p of PRIO) for (const s of SEV) {
    const bugs      = tickets.filter(t => getPriority(t)===p && getSeverity(t)===s && getType(t)==='Bug').length;
    const usability = tickets.filter(t => getPriority(t)===p && getSeverity(t)===s && getType(t)==='Usability').length;
    priorityCounts.push({ label:`${PL[p]}-${SL[s]}`, prio:p, bugs, usability });
  }

  // Milestones
  const msMap = {};
  for (const t of tickets) {
    const m = t.milestone || '(No Milestone)';
    if (!msMap[m]) msMap[m] = { open:0, closed:0, bugs:0, usability:0 };
    t.status.toLowerCase()==='closed' ? msMap[m].closed++ : msMap[m].open++;
    if (getType(t)==='Bug')       msMap[m].bugs++;
    if (getType(t)==='Usability') msMap[m].usability++;
  }
  const milestones = Object.entries(msMap)
    .map(([name,v]) => ({name,...v}))
    .sort((a,b) => (b.open+b.closed)-(a.open+a.closed))
    .slice(0, 10);
  const msTotal = milestones.reduce((acc,m) => ({
    open:    acc.open+m.open,
    closed:  acc.closed+m.closed,
    bugs:    acc.bugs+m.bugs,
    usability: acc.usability+m.usability,
  }), {open:0,closed:0,bugs:0,usability:0});

  // Members
  const memberMap = {};
  const bump = (key, field) => {
    if (!key) return;
    if (!memberMap[key]) memberMap[key] = {bug:0,usability:0,bugReview:0,reopen:0,testCase:0,closed:0,low:0,med:0,high:0,urg:0,total:0};
    memberMap[key][field]++;
  };
  for (const t of tickets) {
    const a = t.author || 'Unknown';
    const type = getType(t);
    const prio = getPriority(t);
    if (type==='Bug')       bump(a,'bug');
    else if (type==='Usability') bump(a,'usability');
    else if (type==='Test Case') bump(a,'testCase');
    if (t.labels.some(l=>l.toLowerCase().includes('bug review'))) bump(a,'bugReview');
    if (t.reopened.toLowerCase()==='yes') bump(a,'reopen');
    if (t.status.toLowerCase()==='closed') bump(a,'closed');
    if (prio==='low')    bump(a,'low');
    if (prio==='medium') bump(a,'med');
    if (prio==='high')   bump(a,'high');
    if (prio==='urgent') bump(a,'urg');
    bump(a,'total');
  }
  const members = Object.entries(memberMap)
    .map(([name,v]) => ({name,...v}))
    .sort((a,b) => b.total-a.total);
  const memberTotals = members.reduce((acc,m) => {
    for (const k of Object.keys(m)) if (k!=='name') acc[k]=(acc[k]||0)+m[k];
    return acc;
  }, {});

  // Distribution donut
  const bugCount     = tickets.filter(t=>getType(t)==='Bug').length;
  const usabCount    = tickets.filter(t=>getType(t)==='Usability').length;
  const tcCount      = tickets.filter(t=>getType(t)==='Test Case').length;
  const bugRevCount  = tickets.filter(t=>t.labels.some(l=>l.toLowerCase().includes('bug review'))).length;
  const reopenCount  = tickets.filter(t=>t.reopened.toLowerCase()==='yes').length;
  const distTotal    = bugCount+usabCount+tcCount+bugRevCount+reopenCount+closed;
  const pct = v => distTotal ? ((v/distTotal)*100).toFixed(1) : 0;

  const donut = [
    { label:'Test Case',  value:tcCount,    pct:pct(tcCount),    color:'#5b8fff' },
    { label:'Bug Review', value:bugRevCount,pct:pct(bugRevCount),color:'#00e5a8' },
    { label:'Bug',        value:bugCount,   pct:pct(bugCount),   color:'#ffb84d' },
    { label:'Usability',  value:usabCount,  pct:pct(usabCount),  color:'#b07fff' },
    { label:'Reopen',     value:reopenCount,pct:pct(reopenCount),color:'#ff5577' },
    { label:'Closed',     value:closed,     pct:pct(closed),     color:'#3a4260' },
  ];

  // Top priority open issues
  const urgent = tickets
    .filter(t => t.status.toLowerCase()!=='closed' && ['urgent','high'].includes(getPriority(t)))
    .sort((a,b) => (getPriority(a)==='urgent'?0:1)-(getPriority(b)==='urgent'?0:1))
    .slice(0,8)
    .map(t => ({
      level:  getPriority(t)==='urgent'?'Urgent':'High',
      color:  getPriority(t)==='urgent'?'#ff5577':'#ffb84d',
      label:  t.milestone || t.project || '',
      title:  t.title,
    }));

  // Sprint date info
  const dates = tickets.map(t=>t.createdAt).filter(Boolean);
  let sprintStart='', sprintEnd='', remainingDays=0, totalDays=0;
  if (dates.length) {
    sprintStart = dates[dates.length-1];
    sprintEnd   = dates[0];
    try {
      const parseD = d => { const m=d.match(/(\w+),\s+(\w+)\s+(\d+),\s+(\d+)/); return m?new Date(`${m[2]} ${m[3]}, ${m[4]}`):new Date(d); };
      const s=parseD(sprintStart), e=parseD(sprintEnd), now=new Date();
      totalDays    = Math.max(1,Math.round((e-s)/86400000));
      remainingDays= Math.max(0,Math.round((e-now)/86400000));
    } catch(e){}
  }

  const sprintName = milestones.length ? milestones[0].name : 'Current Sprint';

  const kpis = [
    { label:'Resolution Rate',       value:resPct,           sub:`${closed} of ${total} closed`,      color:'c-warn'   },
    { label:'Tickets Created',       value:String(total),    sub:'This sprint',                        color:'c-accent' },
    { label:'Tickets Closed',        value:String(closed),   sub:`${open} remaining open`,             color:'c-green'  },
    { label:'For Manual QA Review',  value:String(manualQA), sub:'Pending review',                     color:'c-accent' },
    { label:'For Automation Review', value:String(autoQA),   sub:'Awaiting automation QA',             color:'c-purple' },
    { label:'For QA Lead Review',    value:String(leadQA),   sub:'Needs lead sign-off',                color:'c-warn'   },
    { label:'Reviewed Test Cases',   value:String(reviewed), sub:'Completed reviews',                  color:'c-green'  },
    { label:'Changes Requested',     value:String(changes),  sub:'Revisions needed',                   color:'c-danger' },
    { label:'On Hold',               value:String(onHold),   sub:'Suspended tickets',                  color:'c-danger' },
  ];

  return {
    total, closed, open, kpis,
    priorityCounts, milestones, msTotal,
    members, memberTotals,
    reporters: members.slice(0,6),
    donut, urgent,
    sprintName, sprintStart, sprintEnd,
    totalDays, remainingDays,
  };
}

/* ══════════════════════════════════════════════════
   HELPERS
══════════════════════════════════════════════════ */
function avatarColor(name) {
  let h = 0;
  for (const c of name) h = (h*31 + c.charCodeAt(0)) % AVATAR_COLORS.length;
  return AVATAR_COLORS[Math.abs(h)];
}
function initials(name) {
  return (name||'').split(' ').slice(0,2).map(w=>w[0]||'').join('').toUpperCase();
}
function n(v) {
  return (v===0||v==='0') ? `<span class="zero">—</span>` : v;
}
function priClass(label) {
  if (label.startsWith('Urg')) return 'p-urg';
  if (label.startsWith('High')) return 'p-high';
  if (label.startsWith('Med')) return 'p-med';
  return 'p-low';
}

  const distItems = donut.map(d => `
<div class="dist-item">
  <div class="dist-dot" style="background:${d.color}"></div>
  <div class="dist-label">${d.label}</div>
  <div class="dist-count">${d.value}</div>
  <div class="dist-pct">${d.pct}%</div>
</div>`).join('');

  const urgItems = urgent.length
    ? urgent.map(i => `
<div class="issue-item">
  <div class="issue-meta">
    <span class="p-tag" style="background:${i.color}22;color:${i.color};border:1px solid ${i.color}44">${i.level}</span>
  </div>
  <div class="issue-title">${i.title}</div>
  <div class="issue-path">${i.label}</div>
</div>`).join('')
    : `<div style="font-size:12px;color:var(--text-dim);padding:16px 0">No urgent/high priority open tickets. 🎉</div>`;

  const chartsSection = `
<div class="grid-3">
  <div class="card">
    <div class="card-title">Top Reporters</div>
    ${repBars}
  </div>
  <div class="card">
    <div class="card-title">Output Distribution</div>
    ${distItems}
    <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border);display:flex;justify-content:space-between;font-size:12px;color:var(--text-muted)">
      <span>Total tickets</span>
      <span style="font-family:var(--mono);color:var(--text)">${donut.reduce((s,d)=>s+d.value,0)}</span>
    </div>
  </div>
  <div class="card">
    <div class="card-title">Top Priority Issues</div>
    ${urgItems}
  </div>
</div>`;

  const footer = `
<div style="text-align:center;padding:20px 0 8px;font-size:11px;color:var(--text-dim);position:relative;z-index:1">
  QA Performance Dashboard · ${new Date().toLocaleDateString()} · ${currentUser.email}
</div>`;

  document.getElementById('dashboardRoot').innerHTML = `
<div class="dash">
  ${topbar}
  ${announce}
  ${kpiSection}
  ${prioritySection}
  ${membersSection}
  ${chartsSection}
  ${footer}
</div>`;
}

/* ══════════════════════════════════════════════════
   ORCHESTRATOR
══════════════════════════════════════════════════ */
function setStatus(msg) {
  document.getElementById('loadStatus').textContent = msg;
}

async function loadDashboard() {
  document.getElementById('loginScreen').style.display   = 'none';
  document.getElementById('loadingScreen').style.display = 'flex';
  document.getElementById('dashboardRoot').style.display = 'none';

  try {
    setStatus('Fetching ticket data from Google Sheets…');
    const rows = await fetchSheetData();

    if (!rows || rows.length < 2) {
      throw new Error('No data found in ALL TICKETS tab.');
    }

    setStatus(`Parsing ${rows.length - 1} ticket(s)…`);
    const tickets = parseTickets(rows);

    if (!tickets.length) {
      throw new Error('Could not parse any tickets. Check that row 3 has the correct headers.');
    }

    setStatus('Computing metrics…');
    const metrics = computeMetrics(tickets);

    setStatus('Rendering dashboard…');
    document.getElementById('loadingScreen').style.display = 'none';
    document.getElementById('dashboardRoot').style.display = 'block';
    renderDashboard(metrics);

  } catch (err) {
    document.getElementById('loadingScreen').style.display = 'none';
    // If session expired, signOut() already redirected to login
    if (accessToken) {
      document.getElementById('dashboardRoot').innerHTML = `
<div class="dash">
  <div class="err-banner">⚠ ${err.message || String(err)}<br><br>
    <button class="btn" onclick="loadDashboard()">↺ Retry</button>
    <button class="btn btn-danger" onclick="signOut()" style="margin-left:8px">Sign out</button>
  </div>
</div>`;
      document.getElementById('dashboardRoot').style.display = 'block';
    }
    console.error(err);
  }
}
</script>
