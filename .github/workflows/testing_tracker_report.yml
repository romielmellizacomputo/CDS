name: Testing Tracker Report
on:
  schedule:
    - cron: '0 2 * * *'   # 10:00 AM PHT (UTC+8)
    - cron: '0 6 * * *'   # 2:00 PM PHT (UTC+8)
    - cron: '0 10 * * *'  # 6:00 PM PHT (UTC+8)
  workflow_dispatch:
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          repository: romielmellizacomputo/centralized-docs-system
          token: ${{ secrets.PAT_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install google-api-python-client google-auth requests pytz
      - name: Run testing_tracker_report.py
        continue-on-error: true
        run: python leads-cds/testing_tracker_report.py
        env:
          PYTHONPATH: ${{ github.workspace }}/leads-cds
          CDS_AP_003_SERVICE_ACCOUNT_JSON: ${{ secrets.CDS_AP_003_SERVICE_ACCOUNT_JSON }}
          LEADS_CDS_SID: ${{ secrets.LEADS_CDS_SID }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
