name: QA Sprint Report Runner
on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          repository: romielmellizacomputo/centralized-docs-system
          token: ${{ secrets.PAT_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install google-api-python-client google-auth requests pytz
      - name: Run fetch_sprint_report.py
        continue-on-error: true
        run: python leads-cds/fetch_sprint_report.py
        env:
          PYTHONPATH: ${{ github.workspace }}/leads-cds
          CDS_AP_003_SERVICE_ACCOUNT_JSON: ${{ secrets.CDS_AP_003_SERVICE_ACCOUNT_JSON }}
          LEADS_CDS_SID: ${{ secrets.LEADS_CDS_SID }}
