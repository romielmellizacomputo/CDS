# One-time helper: copies every repository Actions secret from this repo (CDS)
# into romielmellizacomputo/cdsbase.com. Run it manually from the Actions tab.
#
# Needs a secret in CDS named SECRETS_SYNC_TOKEN: a fine-grained personal access
# token with access to cdsbase.com and the "Secrets: Read and write" permission.
#
# Secret values are never printed. Only names appear in the log.
name: Copy Secrets to cdsbase.com

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only list what would be copied (no changes)"
        type: boolean
        default: true
      overwrite:
        description: "Overwrite secrets that already exist in cdsbase.com"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  copy:
    runs-on: ubuntu-latest
    env:
      TARGET_REPO: romielmellizacomputo/cdsbase.com
      DRY_RUN: ${{ inputs.dry_run }}
      OVERWRITE: ${{ inputs.overwrite }}
      GH_TOKEN: ${{ secrets.SECRETS_SYNC_TOKEN }}
      ALL_SECRETS: ${{ toJSON(secrets) }}
    steps:
      - name: Check token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Add a SECRETS_SYNC_TOKEN secret to CDS first (see comments at top of this file)."
            exit 1
          fi
          gh secret list --repo "$TARGET_REPO" > /dev/null \
            || { echo "::error::SECRETS_SYNC_TOKEN cannot manage secrets in $TARGET_REPO."; exit 1; }

      - name: Copy secrets
        run: |
          set -euo pipefail
          existing="$(gh secret list --repo "$TARGET_REPO" --json name --jq '.[].name')"

          # Skip the built-in Actions token and the sync token itself.
          names="$(jq -r 'keys[] | select(. != "github_token" and . != "SECRETS_SYNC_TOKEN")' <<< "$ALL_SECRETS")"

          copied=0; skipped=0
          for name in $names; do
            if grep -qx "$name" <<< "$existing" && [ "$OVERWRITE" != "true" ]; then
              echo "SKIP  $name (already exists in target)"
              skipped=$((skipped+1)); continue
            fi
            if [ "$DRY_RUN" = "true" ]; then
              echo "WOULD COPY  $name"
            else
              # Pipe the value through stdin so it never appears in a command line.
              jq -j --arg n "$name" '.[$n]' <<< "$ALL_SECRETS" \
                | gh secret set "$name" --repo "$TARGET_REPO"
              echo "COPIED  $name"
            fi
            copied=$((copied+1))
          done

          echo "----"
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: $copied would be copied, $skipped skipped. Re-run with dry_run unchecked to copy."
          else
            echo "Done: $copied copied, $skipped skipped."
          fi
